<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TwinChat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #eef1f5;
  color: #172033;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

.app {
  max-width: 1100px;
  min-height: 100vh;
  margin: auto;
  background: white;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  height: 72px;
  padding: 14px 20px;
  background: #111827;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 24px;
  font-weight: 800;
}

.tagline {
  color: #aeb7c5;
  font-size: 12px;
}

.header-user {
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-name {
  font-size: 13px;
}

/* AVATAR */

.avatar {
  width: 43px;
  height: 43px;
  border-radius: 50%;
  background: #dfe4ec;
  color: #344054;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  overflow: hidden;
  flex-shrink: 0;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* AUTH */

.auth {
  width: 100%;
  max-width: 430px;
  margin: auto;
  padding: 25px 20px;
}

.auth-card {
  border: 1px solid #e1e5eb;
  border-radius: 20px;
  padding: 28px;
  box-shadow: 0 10px 35px rgba(20, 30, 50, .07);
}

.auth-card h2 {
  margin: 0 0 7px;
}

.auth-card p {
  color: #6b7280;
}

.auth input {
  margin-top: 10px;
}

input {
  width: 100%;
  border: 1px solid #d8dde6;
  border-radius: 12px;
  padding: 13px;
  outline: none;
}

input:focus {
  border-color: #111827;
}

.primary-btn,
.secondary-btn {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 13px;
  margin-top: 10px;
}

.primary-btn {
  background: #111827;
  color: white;
}

.secondary-btn {
  background: #edf0f4;
  color: #172033;
}

.status {
  margin-top: 12px;
  font-size: 13px;
  color: #6b7280;
}

/* MAIN */

.main {
  flex: 1;
  display: flex;
  min-height: calc(100vh - 72px);
}

/* SIDEBAR */

.sidebar {
  width: 330px;
  border-right: 1px solid #e5e7eb;
  display: flex;
  flex-direction: column;
  background: white;
}

.sidebar-top {
  padding: 18px;
  border-bottom: 1px solid #edf0f3;
}

.sidebar-title h2 {
  margin: 0;
  font-size: 21px;
}

.search-row {
  display: flex;
  gap: 7px;
  margin-top: 14px;
}

.search {
  flex: 1;
  min-width: 0;
}

.search-btn {
  width: auto;
  border: 0;
  border-radius: 12px;
  padding: 0 13px;
  background: #111827;
  color: white;
}

.search-results {
  margin-top: 8px;
}

.user-result {
  width: 100%;
  border: 0;
  background: #f4f6f9;
  border-radius: 12px;
  padding: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  margin-top: 6px;
}

.user-result-info {
  min-width: 0;
}

.user-result-name {
  font-weight: 700;
}

.user-result-email {
  font-size: 12px;
  color: #7b8493;
  overflow: hidden;
  text-overflow: ellipsis;
}

.conversations-title {
  padding: 15px 18px 7px;
  color: #7b8493;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

.conversations {
  flex: 1;
  overflow-y: auto;
}

.conversation {
  width: 100%;
  border: 0;
  background: white;
  padding: 12px 17px;
  display: flex;
  align-items: center;
  gap: 11px;
  text-align: left;
}

.conversation:hover,
.conversation.active {
  background: #f3f5f8;
}

.conversation-info {
  flex: 1;
  min-width: 0;
}

.conversation-row {
  display: flex;
  justify-content: space-between;
  gap: 7px;
}

.conversation-name {
  font-weight: 700;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.conversation-time {
  color: #8b94a3;
  font-size: 10px;
}

.conversation-bottom {
  display: flex;
  align-items: center;
  gap: 7px;
}

.conversation-preview {
  flex: 1;
  min-width: 0;
  color: #7b8493;
  font-size: 13px;
  margin-top: 3px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.unread {
  background: #111827;
  color: white;
  border-radius: 20px;
  padding: 3px 7px;
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
}

.logout {
  padding: 12px 16px 17px;
}

.logout button {
  width: 100%;
  border: 0;
  border-radius: 11px;
  padding: 11px;
  background: #edf0f4;
}

/* CHAT */

.chat {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: #f7f8fa;
}

.empty-chat {
  margin: auto;
  text-align: center;
  color: #7b8493;
  padding: 30px;
}

.empty-chat h2 {
  color: #172033;
}

.chat-area {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.chat-header {
  min-height: 70px;
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 10px 17px;
  display: flex;
  align-items: center;
  gap: 11px;
}

.chat-user-info {
  min-width: 0;
}

.chat-user-name {
  font-weight: 750;
}

.chat-user-email {
  color: #7b8493;
  font-size: 12px;
}

/* MESSAGES */

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
}

.message-wrap {
  display: flex;
  margin: 9px 0;
}

.message-wrap.mine {
  justify-content: flex-end;
}

.message-container {
  max-width: min(75%, 520px);
}

.message {
  position: relative;
  padding: 10px 13px;
  border-radius: 16px;
  background: #e3e7ed;
  word-break: break-word;
  user-select: none;
}

.message-wrap.mine .message {
  background: #111827;
  color: white;
  border-bottom-right-radius: 5px;
}

.message-wrap:not(.mine) .message {
  border-bottom-left-radius: 5px;
}

.message-text {
  white-space: pre-wrap;
}

.message-time {
  font-size: 10px;
  opacity: .6;
  margin-top: 4px;
  text-align: right;
}

.read-status {
  font-size: 10px;
  opacity: .65;
  text-align: right;
  margin-top: 3px;
}

/* REACTIONS */

.reactions {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 5px;
}

.reaction {
  border: 1px solid #d5dbe4;
  background: white;
  border-radius: 20px;
  padding: 3px 8px;
  font-size: 13px;
}

.reaction-picker {
  display: flex;
  gap: 2px;
  width: max-content;
  margin-top: 6px;
  padding: 5px;
  border: 1px solid #d8dde6;
  background: white;
  border-radius: 22px;
  box-shadow: 0 5px 20px rgba(0,0,0,.13);
}

.reaction-picker button {
  border: 0;
  background: transparent;
  border-radius: 10px;
  padding: 5px 7px;
  font-size: 19px;
}

.reaction-picker button:hover {
  background: #eef1f5;
}

/* TYPING */

.typing-indicator {
  display: flex;
  gap: 4px;
  align-items: center;
  width: fit-content;
  margin: 0 18px 8px;
  padding: 10px 13px;
  background: #e3e7ed;
  border-radius: 16px;
  border-bottom-left-radius: 5px;
}

.typing-indicator span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #7b8493;
  animation: bounce 1.2s infinite;
}

.typing-indicator span:nth-child(2) {
  animation-delay: .15s;
}

.typing-indicator span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes bounce {
  0%, 60%, 100% {
    transform: translateY(0);
    opacity: .4;
  }

  30% {
    transform: translateY(-4px);
    opacity: 1;
  }
}

/* COMPOSER */

.composer {
  display: flex;
  gap: 8px;
  padding: 11px;
  background: white;
  border-top: 1px solid #e5e7eb;
}

.composer input {
  flex: 1;
  margin: 0;
}

.composer button {
  width: 75px;
  border: 0;
  border-radius: 12px;
  background: #111827;
  color: white;
}

/* MOBILE */

@media (max-width: 700px) {

  .header {
    height: 65px;
  }

  .header-name {
    display: none;
  }

  .main {
    flex-direction: column;
    min-height: calc(100vh - 65px);
  }

  .sidebar {
    width: 100%;
    height: 350px;
    border-right: 0;
    border-bottom: 1px solid #e5e7eb;
  }

  .chat {
    min-height: 500px;
  }

  .message-container {
    max-width: 84%;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div>
    <div class="logo">TwinChat</div>
    <div class="tagline">Private messaging made simple.</div>
  </div>

  <div class="header-user">
    <span id="headerName" class="header-name"></span>
    <div id="headerAvatar" class="avatar"></div>
  </div>
</header>

<!-- AUTH -->

<section id="authScreen" class="auth">

  <div class="auth-card">

    <h2>Welcome to TwinChat 👋</h2>

    <p>Chat privately with your friends.</p>

    <input id="email" type="email" placeholder="Email address">

    <input id="password" type="password" placeholder="Password">

    <button id="signupBtn" class="primary-btn">
      Create Account
    </button>

    <button id="loginBtn" class="secondary-btn">
      Log In
    </button>

    <div id="authStatus" class="status"></div>

  </div>

</section>

<!-- MAIN -->

<section id="mainScreen" class="main hidden">

<aside class="sidebar">

  <div class="sidebar-top">

    <div class="sidebar-title">
      <h2>Messages</h2>
    </div>

    <div class="search-row">

      <input
        id="searchInput"
        class="search"
        placeholder="Search for someone..."
      >

      <button id="searchBtn" class="search-btn">
        🔍
      </button>

    </div>

    <div id="searchResults" class="search-results"></div>

  </div>

  <div class="conversations-title">
    Your chats
  </div>

  <div id="conversationList" class="conversations"></div>

  <div class="logout">
    <button id="logoutBtn">Log Out</button>
  </div>

</aside>

<main class="chat">

  <div id="emptyChat" class="empty-chat">

    <h2>Your messages</h2>

    <p>
      Search for someone to start a conversation.
    </p>

  </div>

  <div id="chatArea" class="chat-area hidden">

    <div class="chat-header">

      <div id="chatAvatar" class="avatar"></div>

      <div class="chat-user-info">

        <div id="chatTitle" class="chat-user-name"></div>

        <div id="chatEmail" class="chat-user-email"></div>

      </div>

    </div>

    <div id="messages" class="messages"></div>

    <div id="typingIndicator" class="typing-indicator hidden">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="composer">

      <input
        id="messageInput"
        placeholder="Write a message..."
      >

      <button id="sendBtn">
        Send
      </button>

    </div>

  </div>

</main>

</section>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  addDoc,
  getDoc,
  getDocs,
  updateDoc,
  query,
  where,
  orderBy,
  onSnapshot,
  serverTimestamp,
  increment
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyB-A2OZTgE__xkowZalDL9Dm8-TIy5DjjU",
  authDomain: "twinchat-e77f1.firebaseapp.com",
  projectId: "twinchat-e77f1",
  storageBucket: "twinchat-e77f1.firebasestorage.app",
  messagingSenderId: "739355722602",
  appId: "1:739355722602:web:a77a2d1638459ee0e8db13"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* ELEMENTS */

const authScreen = document.getElementById("authScreen");
const mainScreen = document.getElementById("mainScreen");

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const signupBtn = document.getElementById("signupBtn");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

const authStatus = document.getElementById("authStatus");

const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const searchResults = document.getElementById("searchResults");

const conversationList = document.getElementById("conversationList");

const emptyChat = document.getElementById("emptyChat");
const chatArea = document.getElementById("chatArea");

const chatAvatar = document.getElementById("chatAvatar");
const chatTitle = document.getElementById("chatTitle");
const chatEmail = document.getElementById("chatEmail");

const messagesDiv = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

const typingIndicator =
  document.getElementById("typingIndicator");

const headerName =
  document.getElementById("headerName");

const headerAvatar =
  document.getElementById("headerAvatar");


/* STATE */

let currentConversationId = null;
let currentOtherUser = null;

let unsubscribeMessages = null;
let unsubscribeConversations = null;
let unsubscribeTyping = null;

let typingTimeout = null;


/* AVATAR */

function setAvatar(element, user) {

  element.innerHTML = "";

  if (user && user.photoURL) {

    const img = document.createElement("img");

    img.src = user.photoURL;
    img.alt = "";

    element.appendChild(img);

  } else {

    const name =
      user?.displayName ||
      user?.email ||
      "?";

    element.textContent =
      name.charAt(0).toUpperCase();
  }
}


/* ACCOUNT CREATION */

signupBtn.addEventListener("click", async () => {

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    authStatus.textContent =
      "Enter an email and password.";
    return;
  }

  if (password.length < 6) {
    authStatus.textContent =
      "Password must be at least 6 characters.";
    return;
  }

  signupBtn.disabled = true;

  try {

    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    const user = result.user;

    await setDoc(
      doc(db, "users", user.uid),
      {
        email: user.email,
        displayName: email.split("@")[0],
        photoURL: "",
        createdAt: serverTimestamp()
      }
    );

    authStatus.textContent =
      "Account created!";

  } catch (error) {

    authStatus.textContent =
      friendlyError(error);

  } finally {

    signupBtn.disabled = false;
  }
});


/* LOGIN */

loginBtn.addEventListener("click", async () => {

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    authStatus.textContent =
      "Enter your email and password.";
    return;
  }

  loginBtn.disabled = true;

  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  } catch (error) {

    authStatus.textContent =
      friendlyError(error);

  } finally {

    loginBtn.disabled = false;
  }
});


/* LOGOUT */

logoutBtn.addEventListener("click", async () => {

  await signOut(auth);
});


/* AUTH STATE */

onAuthStateChanged(auth, async user => {

  if (!user) {

    authScreen.classList.remove("hidden");
    mainScreen.classList.add("hidden");

    if (unsubscribeMessages) {
      unsubscribeMessages();
      unsubscribeMessages = null;
    }

    if (unsubscribeConversations) {
      unsubscribeConversations();
      unsubscribeConversations = null;
    }

    if (unsubscribeTyping) {
      unsubscribeTyping();
      unsubscribeTyping = null;
    }

    currentConversationId = null;
    currentOtherUser = null;

    return;
  }

  authScreen.classList.add("hidden");
  mainScreen.classList.remove("hidden");

  try {

    let profile =
      await getUserProfile(user.uid);

    if (!profile) {

      await setDoc(
        doc(db, "users", user.uid),
        {
          email: user.email,
          displayName:
            user.email.split("@")[0],
          photoURL: "",
          createdAt: serverTimestamp()
        }
      );

      profile =
        await getUserProfile(user.uid);
    }

    headerName.textContent =
      profile?.displayName ||
      user.email;

    setAvatar(
      headerAvatar,
      profile || { email: user.email }
    );

    loadConversations();

  } catch (error) {

    console.error(error);

    authStatus.textContent =
      "Could not load your account.";
  }
});


/* GET PROFILE */

async function getUserProfile(uid) {

  const snap =
    await getDoc(
      doc(db, "users", uid)
    );

  if (!snap.exists()) {
    return null;
  }

  return {
    ...snap.data(),
    uid
  };
}


/* SEARCH */

searchBtn.addEventListener(
  "click",
  searchUsers
);

searchInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      searchUsers();
    }
  }
);


async function searchUsers() {

  const text =
    searchInput.value.trim().toLowerCase();

  searchResults.innerHTML = "";

  if (!text) {
    return;
  }

  try {

    const snapshot =
      await getDocs(
        collection(db, "users")
      );

    let found = false;

    snapshot.forEach(userDoc => {

      const user = userDoc.data();

      if (
        auth.currentUser &&
        userDoc.id === auth.currentUser.uid
      ) {
        return;
      }

      const email =
        (user.email || "").toLowerCase();

      const name =
        (user.displayName || "").toLowerCase();

      if (
        email.includes(text) ||
        name.includes(text)
      ) {

        found = true;

        const button =
          document.createElement("button");

        button.className = "user-result";

        const avatar =
          document.createElement("div");

        avatar.className = "avatar";

        setAvatar(avatar, user);

        const info =
          document.createElement("div");

        info.className = "user-result-info";

        const nameElement =
          document.createElement("div");

        nameElement.className =
          "user-result-name";

        nameElement.textContent =
          user.displayName ||
          "User";

        const emailElement =
          document.createElement("div");

        emailElement.className =
          "user-result-email";

        emailElement.textContent =
          user.email || "";

        info.appendChild(nameElement);
        info.appendChild(emailElement);

        button.appendChild(avatar);
        button.appendChild(info);

        button.addEventListener(
          "click",
          () => {

            startConversation(
              userDoc.id,
              {
                ...user,
                uid: userDoc.id
              }
            );

            searchResults.innerHTML = "";
            searchInput.value = "";
          }
        );

        searchResults.appendChild(button);
      }
    });

    if (!found) {
      searchResults.textContent =
        "No users found.";
    }

  } catch (error) {

    console.error(error);

    searchResults.textContent =
      "Search failed.";
  }
}


/* START CONVERSATION */

async function startConversation(
  otherUserId,
  otherUser
) {

  const user = auth.currentUser;

  if (!user) {
    return;
  }

  const participants =
    [user.uid, otherUserId].sort();

  const conversationId =
    participants.join("_");

  const conversationRef =
    doc(
      db,
      "conversations",
      conversationId
    );

  try {

    const existing =
      await getDoc(conversationRef);

    if (!existing.exists()) {

      await setDoc(
        conversationRef,
        {
          participants,

          lastMessage: "",

          updatedAt:
            serverTimestamp(),

          unreadCounts: {
            [user.uid]: 0,
            [otherUserId]: 0
          },

          typing: {
            [user.uid]: false,
            [otherUserId]: false
          }
        }
      );
    }

    currentConversationId =
      conversationId;

    currentOtherUser = {
      ...otherUser,
      uid: otherUserId
    };

    emptyChat.classList.add("hidden");
    chatArea.classList.remove("hidden");

    chatTitle.textContent =
      otherUser.displayName ||
      "User";

    chatEmail.textContent =
      otherUser.email || "";

    setAvatar(chatAvatar, otherUser);

    await clearUnread(conversationId);

    listenForMessages();
    listenForTyping();

    loadConversations();

    messageInput.focus();

  } catch (error) {

    console.error(
      "Conversation error:",
      error
    );

    alert(
      "Could not open this conversation."
    );
  }
}


/* CLEAR UNREAD */

async function clearUnread(conversationId) {

  const user = auth.currentUser;

  if (!user) {
    return;
  }

  try {

    await updateDoc(
      doc(
        db,
        "conversations",
        conversationId
      ),
      {
        [`unreadCounts.${user.uid}`]: 0
      }
    );

  } catch (error) {

    console.error(
      "Unread error:",
      error
    );
  }
}


/* LOAD CONVERSATIONS */

function loadConversations() {

  const user = auth.currentUser;

  if (!user) {
    return;
  }

  if (unsubscribeConversations) {
    unsubscribeConversations();
  }

  /*
    We intentionally do NOT use orderBy here.
    This avoids needing a composite Firestore index.
  */

  const q =
    query(
      collection(db, "conversations"),
      where(
        "participants",
        "array-contains",
        user.uid
      )
    );

  unsubscribeConversations =
    onSnapshot(
      q,
      async snapshot => {

        conversationList.innerHTML = "";

        const conversations = [];

        for (const conversationDoc of snapshot.docs) {

          const conversation =
            conversationDoc.data();

          const otherId =
            conversation.participants.find(
              id => id !== user.uid
            );

          if (!otherId) {
            continue;
          }

          const otherUser =
            await getUserProfile(otherId);

          if (!otherUser) {
            continue;
          }

          conversations.push({
            doc: conversationDoc,
            data: conversation,
            otherId,
            otherUser
          });
        }

        conversations.sort((a, b) => {

          const aTime =
            a.data.updatedAt?.toMillis?.() || 0;

          const bTime =
            b.data.updatedAt?.toMillis?.() || 0;

          return bTime - aTime;
        });

        for (const item of conversations) {

          const conversation =
            item.data;

          const button =
            document.createElement("button");

          button.className = "conversation";

          if (
            item.doc.id ===
            currentConversationId
          ) {
            button.classList.add("active");
          }

          const avatar =
            document.createElement("div");

          avatar.className = "avatar";

          setAvatar(
            avatar,
            item.otherUser
          );

          const info =
            document.createElement("div");

          info.className =
            "conversation-info";

          const row =
            document.createElement("div");

          row.className =
            "conversation-row";

          const name =
            document.createElement("div");

          name.className =
            "conversation-name";

          name.textContent =
            item.otherUser.displayName ||
            item.otherUser.email;

          const time =
            document.createElement("div");

          time.className =
            "conversation-time";

          time.textContent =
            formatTimestamp(
              conversation.updatedAt
            );

          row.appendChild(name);
          row.appendChild(time);

          const bottom =
            document.createElement("div");

          bottom.className =
            "conversation-bottom";

          const preview =
            document.createElement("div");

          preview.className =
            "conversation-preview";

          preview.textContent =
            conversation.lastMessage ||
            "No messages yet";

          bottom.appendChild(preview);

          const unreadCount =
            Number(
              conversation.unreadCounts?.[
                user.uid
              ] || 0
            );

          if (unreadCount > 0) {

            const unread =
              document.createElement("div");

            unread.className = "unread";

            unread.textContent =
              unreadCount === 1
                ? "1 unread"
                : `${unreadCount} unread`;

            bottom.appendChild(unread);
          }

          info.appendChild(row);
          info.appendChild(bottom);

          button.appendChild(avatar);
          button.appendChild(info);

          button.addEventListener(
            "click",
            () => {

              startConversation(
                item.otherId,
                item.otherUser
              );
            }
          );

          conversationList.appendChild(button);
        }
      },
      error => {

        console.error(
          "Conversation listener:",
          error
        );
      }
    );
}


/* LISTEN FOR MESSAGES */

function listenForMessages() {

  if (!currentConversationId) {
    return;
  }

  if (unsubscribeMessages) {
    unsubscribeMessages();
  }

  const q =
    query(
      collection(
        db,
        "conversations",
        currentConversationId,
        "messages"
      ),
      orderBy("createdAt", "asc")
    );

  unsubscribeMessages =
    onSnapshot(
      q,
      snapshot => {

        messagesDiv.innerHTML = "";

        snapshot.forEach(messageDoc => {

          renderMessage(
            messageDoc.id,
            messageDoc.data()
          );
        });

        messagesDiv.scrollTop =
          messagesDiv.scrollHeight;

        markIncomingMessagesRead(snapshot);
      },
      error => {

        console.error(
          "Message listener:",
          error
        );
      }
    );
}


/* RENDER MESSAGE */

function renderMessage(messageId, message) {

  const user = auth.currentUser;

  const mine =
    message.senderId === user.uid;

  const wrap =
    document.createElement("div");

  wrap.className =
    "message-wrap" +
    (mine ? " mine" : "");

  const container =
    document.createElement("div");

  container.className =
    "message-container";

  const box =
    document.createElement("div");

  box.className = "message";

  const text =
    document.createElement("div");

  text.className = "message-text";

  text.textContent =
    message.text || "";

  box.appendChild(text);

  if (message.createdAt) {

    const time =
      document.createElement("div");

    time.className =
      "message-time";

    time.textContent =
      formatTimestamp(
        message.createdAt
      );

    box.appendChild(time);
  }

  container.appendChild(box);


  /* READ RECEIPT */

  if (mine) {

    const read =
      document.createElement("div");

    read.className =
      "read-status";

    read.textContent =
      message.readAt
        ? "✓✓ Read"
        : "✓ Sent";

    container.appendChild(read);
  }


  /* REACTIONS */

  const reactionsDiv =
    document.createElement("div");

  reactionsDiv.className =
    "reactions";

  const reactions =
    message.reactions || {};

  Object.entries(reactions).forEach(
    ([emoji, count]) => {

      if (Number(count) <= 0) {
        return;
      }

      const button =
        document.createElement("button");

      button.className = "reaction";

      button.textContent =
        `${emoji} ${count}`;

      button.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          reactToMessage(
            messageId,
            emoji
          );
        }
      );

      reactionsDiv.appendChild(button);
    }
  );

  container.appendChild(reactionsDiv);


  /* REACTION PICKER */

  const picker =
    document.createElement("div");

  picker.className =
    "reaction-picker hidden";

  const emojis = [
    "❤️",
    "😂",
    "👍",
    "😮",
    "😢"
  ];

  emojis.forEach(emoji => {

    const button =
      document.createElement("button");

    button.textContent = emoji;

    button.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        picker.classList.add("hidden");

        reactToMessage(
          messageId,
          emoji
        );
      }
    );

    picker.appendChild(button);
  });

  container.appendChild(picker);


  /* DOUBLE CLICK / DOUBLE TAP */

  let lastClick = 0;

  box.addEventListener(
    "click",
    event => {

      const now = Date.now();

      if (now - lastClick < 350) {

        event.stopPropagation();

        picker.classList.toggle(
          "hidden"
        );
      }

      lastClick = now;
    }
  );


  wrap.appendChild(container);

  messagesDiv.appendChild(wrap);
}


/* MARK INCOMING MESSAGES READ */

async function markIncomingMessagesRead(snapshot) {

  const user = auth.currentUser;

  if (!user || !currentConversationId) {
    return;
  }

  const promises = [];

  snapshot.forEach(messageDoc => {

    const message =
      messageDoc.data();

    if (
      message.senderId !== user.uid &&
      !message.readAt
    ) {

      promises.push(
        updateDoc(
          doc(
            db,
            "conversations",
            currentConversationId,
            "messages",
            messageDoc.id
          ),
          {
            readAt: serverTimestamp()
          }
        )
      );
    }
  });

  if (promises.length) {

    try {
      await Promise.all(promises);
    } catch (error) {
      console.error(
        "Read receipt error:",
        error
      );
    }
  }
}


/* REACTIONS */

async function reactToMessage(
  messageId,
  emoji
) {

  const user = auth.currentUser;

  if (!user || !currentConversationId) {
    return;
  }

  try {

    const messageRef =
      doc(
        db,
        "conversations",
        currentConversationId,
        "messages",
        messageId
      );

    const snap =
      await getDoc(messageRef);

    if (!snap.exists()) {
      return;
    }

    const message =
      snap.data();

    const reactions = {
      ...(message.reactions || {})
    };

    const userReactions = {
      ...(message.userReactions || {})
    };

    const oldEmoji =
      userReactions[user.uid];


    /*
      Same emoji:
      remove reaction.
    */

    if (oldEmoji === emoji) {

      reactions[emoji] =
        Math.max(
          0,
          Number(reactions[emoji] || 0) - 1
        );

      delete userReactions[user.uid];

    }

    /*
      Different emoji:
      replace old reaction.
    */

    else {

      if (oldEmoji) {

        reactions[oldEmoji] =
          Math.max(
            0,
            Number(
              reactions[oldEmoji] || 0
            ) - 1
          );
      }

      reactions[emoji] =
        Number(
          reactions[emoji] || 0
        ) + 1;

      userReactions[user.uid] =
        emoji;
    }

    await updateDoc(
      messageRef,
      {
        reactions,
        userReactions
      }
    );

  } catch (error) {

    console.error(
      "Reaction error:",
      error
    );
  }
}


/* TYPING LISTENER */

function listenForTyping() {

  if (!currentConversationId) {
    return;
  }

  if (unsubscribeTyping) {
    unsubscribeTyping();
  }

  const conversationRef =
    doc(
      db,
      "conversations",
      currentConversationId
    );

  unsubscribeTyping =
    onSnapshot(
      conversationRef,
      snapshot => {

        if (!snapshot.exists()) {
          return;
        }

        const data =
          snapshot.data();

        const typing =
          data.typing || {};

        const otherId =
          currentOtherUser?.uid;

        const isTyping =
          otherId &&
          typing[otherId] === true;

        typingIndicator.classList.toggle(
          "hidden",
          !isTyping
        );
      }
    );
}


/* TYPING */

messageInput.addEventListener(
  "input",
  async () => {

    const user = auth.currentUser;

    if (!user || !currentConversationId) {
      return;
    }

    const conversationRef =
      doc(
        db,
        "conversations",
        currentConversationId
      );

    try {

      await updateDoc(
        conversationRef,
        {
          [`typing.${user.uid}`]: true
        }
      );

    } catch (error) {

      console.error(
        "Typing error:",
        error
      );

      return;
    }

    clearTimeout(typingTimeout);

    typingTimeout =
      setTimeout(
        async () => {

          try {

            await updateDoc(
              conversationRef,
              {
                [`typing.${user.uid}`]: false
              }
            );

          } catch (error) {

            console.error(error);
          }

        },
        1200
      );
  }
);


/* SEND */

sendBtn.addEventListener(
  "click",
  sendMessage
);

messageInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      event.preventDefault();

      sendMessage();
    }
  }
);


async function sendMessage() {

  const user = auth.currentUser;

  const text =
    messageInput.value.trim();

  if (
    !user ||
    !text ||
    !currentConversationId
  ) {
    return;
  }

  sendBtn.disabled = true;

  try {

    const conversationRef =
      doc(
        db,
        "conversations",
        currentConversationId
      );

    const conversationSnap =
      await getDoc(conversationRef);

    if (!conversationSnap.exists()) {
      throw new Error(
        "Conversation does not exist."
      );
    }

    const conversation =
      conversationSnap.data();

    if (
      !conversation.participants.includes(
        user.uid
      )
    ) {
      throw new Error(
        "You are not a participant."
      );
    }

    const recipientId =
      conversation.participants.find(
        id => id !== user.uid
      );

    await addDoc(
      collection(
        db,
        "conversations",
        currentConversationId,
        "messages"
      ),
      {
        text,
        senderId: user.uid,
        createdAt: serverTimestamp(),
        readAt: null,
        reactions: {},
        userReactions: {}
      }
    );

    await updateDoc(
      conversationRef,
      {
        lastMessage: text,
        updatedAt: serverTimestamp(),

        [`unreadCounts.${recipientId}`]:
          increment(1),

        [`unreadCounts.${user.uid}`]:
          0,

        [`typing.${user.uid}`]:
          false
      }
    );

    clearTimeout(typingTimeout);

    messageInput.value = "";

    messageInput.focus();

  } catch (error) {

    console.error(
      "SEND ERROR:",
      error
    );

    alert(
      "Message could not be sent: " +
      error.message
    );

  } finally {

    sendBtn.disabled = false;
  }
}


/* TIME */

function formatTimestamp(timestamp) {

  if (
    !timestamp ||
    !timestamp.toDate
  ) {
    return "";
  }

  const date =
    timestamp.toDate();

  const now =
    new Date();

  if (
    date.toDateString() ===
    now.toDateString()
  ) {

    return date.toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );
  }

  return date.toLocaleDateString(
    [],
    {
      month: "short",
      day: "numeric"
    }
  );
}


/* ERRORS */

function friendlyError(error) {

  switch (error.code) {

    case "auth/email-already-in-use":
      return "That email already has an account.";

    case "auth/invalid-email":
      return "Please enter a valid email.";

    case "auth/invalid-credential":
      return "Incorrect email or password.";

    case "auth/weak-password":
      return "Password must be at least 6 characters.";

    case "auth/too-many-requests":
      return "Too many attempts. Try again later.";

    default:
      return error.message ||
        "Something went wrong.";
  }
}
