<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TwinChat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #eef1f5;
  color: #172033;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

.app {
  max-width: 1000px;
  min-height: 100vh;
  margin: auto;
  background: white;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  height: 76px;
  padding: 16px 22px;
  background: #111827;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 25px;
  font-weight: 800;
}

.tagline {
  color: #b9c0cc;
  font-size: 12px;
  margin-top: 2px;
}

.header-user {
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-name {
  font-size: 13px;
}

/* AVATAR */

.avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #dfe4ec;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #344054;
  overflow: hidden;
  flex-shrink: 0;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* AUTH */

.auth {
  width: 100%;
  max-width: 430px;
  margin: auto;
  padding: 30px 20px;
}

.auth-card {
  border: 1px solid #e3e7ed;
  border-radius: 22px;
  padding: 28px;
  box-shadow: 0 10px 35px rgba(20, 30, 50, .07);
}

.auth-card h2 {
  margin: 0 0 7px;
  font-size: 26px;
}

.auth-card p {
  color: #6b7280;
}

.auth input {
  margin-top: 10px;
}

input {
  width: 100%;
  border: 1px solid #d8dde6;
  border-radius: 12px;
  padding: 13px 14px;
  outline: none;
  background: white;
}

input:focus {
  border-color: #111827;
}

.primary-btn,
.secondary-btn {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 13px;
  margin-top: 10px;
}

.primary-btn {
  background: #111827;
  color: white;
}

.secondary-btn {
  background: #edf0f4;
  color: #172033;
}

.status {
  margin-top: 12px;
  color: #737d8d;
  font-size: 13px;
  word-break: break-word;
}

/* MAIN */

.main {
  flex: 1;
  display: flex;
  min-height: calc(100vh - 76px);
}

/* SIDEBAR */

.sidebar {
  width: 330px;
  border-right: 1px solid #e5e7eb;
  display: flex;
  flex-direction: column;
  background: white;
}

.sidebar-top {
  padding: 20px;
  border-bottom: 1px solid #edf0f3;
}

.sidebar-title h2 {
  margin: 0;
  font-size: 21px;
}

/* SEARCH */

.search-row {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.search {
  margin: 0;
  flex: 1;
  min-width: 0;
}

.search-btn {
  width: auto;
  margin: 0;
  padding: 0 13px;
  border: 0;
  border-radius: 12px;
  background: #111827;
  color: white;
  white-space: nowrap;
}

.search-results {
  margin-top: 8px;
}

.user-result {
  width: 100%;
  border: 0;
  background: #f5f7fa;
  color: #172033;
  border-radius: 12px;
  padding: 11px;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  margin-top: 6px;
}

.user-result-info {
  min-width: 0;
}

.user-result-name {
  font-weight: 700;
}

.user-result-email {
  color: #7b8493;
  font-size: 12px;
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* CONVERSATIONS */

.conversations-title {
  padding: 16px 20px 8px;
  color: #7b8493;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

.conversations {
  overflow-y: auto;
  flex: 1;
}

.conversation {
  width: 100%;
  border: 0;
  background: white;
  color: #172033;
  padding: 13px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
}

.conversation:hover,
.conversation.active {
  background: #f3f5f8;
}

.conversation-info {
  min-width: 0;
  flex: 1;
}

.conversation-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.conversation-name {
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.conversation-time {
  color: #8b94a3;
  font-size: 11px;
  white-space: nowrap;
}

.conversation-bottom {
  display: flex;
  align-items: center;
  gap: 8px;
}

.conversation-preview {
  color: #7b8493;
  font-size: 13px;
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.unread {
  min-width: 22px;
  height: 22px;
  padding: 0 7px;
  border-radius: 50px;
  background: #111827;
  color: white;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* LOGOUT */

.logout {
  padding: 12px 16px 18px;
}

.logout button {
  width: 100%;
  border: 0;
  background: #edf0f4;
  color: #172033;
  border-radius: 11px;
  padding: 11px;
}

/* CHAT */

.chat {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: #f7f8fa;
}

.empty-chat {
  margin: auto;
  text-align: center;
  padding: 30px;
  color: #7b8493;
}

.empty-chat h2 {
  color: #172033;
}

.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.chat-header {
  min-height: 73px;
  background: white;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  padding: 10px 18px;
  gap: 12px;
}

.chat-user-info {
  min-width: 0;
}

.chat-user-name {
  font-weight: 750;
}

.chat-user-email {
  color: #7b8493;
  font-size: 12px;
  margin-top: 2px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message-wrap {
  display: flex;
  margin: 7px 0;
}

.message-wrap.mine {
  justify-content: flex-end;
}

.message {
  max-width: min(75%, 520px);
  padding: 10px 13px;
  border-radius: 16px;
  background: #e3e7ed;
  color: #172033;
  word-wrap: break-word;
}

.message-wrap.mine .message {
  background: #111827;
  color: white;
  border-bottom-right-radius: 5px;
}

.message-wrap:not(.mine) .message {
  border-bottom-left-radius: 5px;
}

.message-time {
  font-size: 10px;
  opacity: .6;
  margin-top: 4px;
  text-align: right;
}

.composer {
  display: flex;
  gap: 8px;
  background: white;
  border-top: 1px solid #e5e7eb;
  padding: 12px;
}

.composer input {
  flex: 1;
  margin: 0;
}

.composer button {
  width: 75px;
  border: 0;
  border-radius: 12px;
  background: #111827;
  color: white;
}

/* MOBILE */

@media (max-width: 700px) {

  .header {
    height: 68px;
  }

  .header-name {
    display: none;
  }

  .main {
    flex-direction: column;
    min-height: calc(100vh - 68px);
  }

  .sidebar {
    width: 100%;
    height: 360px;
    border-right: 0;
    border-bottom: 1px solid #e5e7eb;
  }

  .chat {
    min-height: 500px;
  }

  .messages {
    padding: 14px;
  }

  .message {
    max-width: 82%;
  }

  .search-btn {
    padding: 0 11px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div>
    <div class="logo">TwinChat</div>
    <div class="tagline">
      Private messaging made simple.
    </div>
  </div>

  <div class="header-user">

    <span
      id="headerName"
      class="header-name"
    ></span>

    <div
      id="headerAvatar"
      class="avatar"
    ></div>

  </div>

</header>


<!-- AUTH -->

<section
  id="authScreen"
  class="auth"
>

  <div class="auth-card">

    <h2>Welcome to TwinChat 👋</h2>

    <p>
      Chat privately with your friends.
    </p>

    <input
      id="email"
      type="email"
      placeholder="Email address"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button
      id="signupBtn"
      class="primary-btn"
    >
      Create Account
    </button>

    <button
      id="loginBtn"
      class="secondary-btn"
    >
      Log In
    </button>

    <div
      id="authStatus"
      class="status"
    ></div>

  </div>

</section>


<!-- MAIN -->

<section
  id="mainScreen"
  class="main hidden"
>

<aside class="sidebar">

  <div class="sidebar-top">

    <div class="sidebar-title">
      <h2>Messages</h2>
    </div>

    <div class="search-row">

      <input
        id="searchInput"
        class="search"
        type="text"
        placeholder="Search for someone..."
      >

      <button
        id="searchBtn"
        class="search-btn"
      >
        🔍 Search
      </button>

    </div>

    <div
      id="searchResults"
      class="search-results"
    ></div>

  </div>

  <div class="conversations-title">
    Your chats
  </div>

  <div
    id="conversationList"
    class="conversations"
  ></div>

  <div class="logout">

    <button id="logoutBtn">
      Log Out
    </button>

  </div>

</aside>


<main class="chat">

  <div
    id="emptyChat"
    class="empty-chat"
  >

    <h2>Your messages</h2>

    <p>
      Search for a user to start a private conversation.
    </p>

  </div>


  <div
    id="chatArea"
    class="chat-area hidden"
  >

    <div class="chat-header">

      <div
        id="chatAvatar"
        class="avatar"
      ></div>

      <div class="chat-user-info">

        <div
          id="chatTitle"
          class="chat-user-name"
        ></div>

        <div
          id="chatEmail"
          class="chat-user-email"
        ></div>

      </div>

    </div>


    <div
      id="messages"
      class="messages"
    ></div>


    <div class="composer">

      <input
        id="messageInput"
        type="text"
        placeholder="Write a message..."
      >

      <button id="sendBtn">
        Send
      </button>

    </div>

  </div>

</main>

</section>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  addDoc,
  getDoc,
  getDocs,
  updateDoc,
  query,
  where,
  orderBy,
  onSnapshot,
  serverTimestamp,
  runTransaction
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey:
    "AIzaSyB-A2OZTgE__xkowZalDL9Dm8-TIy5DjjU",

  authDomain:
    "twinchat-e77f1.firebaseapp.com",

  projectId:
    "twinchat-e77f1",

  storageBucket:
    "twinchat-e77f1.firebasestorage.app",

  messagingSenderId:
    "739355722602",

  appId:
    "1:739355722602:web:a77a2d1638459ee0e8db13"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


const authScreen =
  document.getElementById("authScreen");

const mainScreen =
  document.getElementById("mainScreen");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const signupBtn =
  document.getElementById("signupBtn");

const loginBtn =
  document.getElementById("loginBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const authStatus =
  document.getElementById("authStatus");

const searchInput =
  document.getElementById("searchInput");

const searchBtn =
  document.getElementById("searchBtn");

const searchResults =
  document.getElementById("searchResults");

const conversationList =
  document.getElementById("conversationList");

const emptyChat =
  document.getElementById("emptyChat");

const chatArea =
  document.getElementById("chatArea");

const chatAvatar =
  document.getElementById("chatAvatar");

const chatTitle =
  document.getElementById("chatTitle");

const chatEmail =
  document.getElementById("chatEmail");

const messagesDiv =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const headerName =
  document.getElementById("headerName");

const headerAvatar =
  document.getElementById("headerAvatar");


let currentConversationId = null;
let currentOtherUser = null;
let unsubscribeMessages = null;
let unsubscribeConversations = null;


/* AVATAR */

function setAvatar(element, user) {

  element.innerHTML = "";

  if (user && user.photoURL) {

    const img =
      document.createElement("img");

    img.src = user.photoURL;

    img.alt = "";

    element.appendChild(img);

  } else {

    const name =
      user?.displayName ||
      user?.email ||
      "?";

    element.textContent =
      name.charAt(0).toUpperCase();
  }
}


/* SIGN UP */

signupBtn.addEventListener(
  "click",
  async () => {

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    if (!email || !password) {

      authStatus.textContent =
        "Enter an email and password.";

      return;
    }

    if (password.length < 6) {

      authStatus.textContent =
        "Password must be at least 6 characters.";

      return;
    }

    try {

      const result =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

      const user =
        result.user;

      await setDoc(
        doc(db, "users", user.uid),
        {
          email: user.email,
          displayName: email.split("@")[0],
          photoURL: "",
          createdAt: serverTimestamp()
        }
      );

      authStatus.textContent =
        "Account created!";

    } catch (error) {

      authStatus.textContent =
        friendlyError(error);
    }
  }
);


/* LOGIN */

loginBtn.addEventListener(
  "click",
  async () => {

    try {

      await signInWithEmailAndPassword(
        auth,
        emailInput.value.trim(),
        passwordInput.value
      );

    } catch (error) {

      authStatus.textContent =
        friendlyError(error);
    }
  }
);


/* LOGOUT */

logoutBtn.addEventListener(
  "click",
  async () => {

    await signOut(auth);
  }
);


/* AUTH STATE */

onAuthStateChanged(
  auth,
  async (user) => {

    if (user) {

      authScreen.classList.add("hidden");

      mainScreen.classList.remove("hidden");

      const profile =
        await getUserProfile(user.uid);

      headerName.textContent =
        profile?.displayName ||
        user.email;

      setAvatar(
        headerAvatar,
        profile || {
          email: user.email
        }
      );

      loadConversations();

    } else {

      authScreen.classList.remove("hidden");

      mainScreen.classList.add("hidden");

      if (unsubscribeMessages) {
        unsubscribeMessages();
        unsubscribeMessages = null;
      }

      if (unsubscribeConversations) {
        unsubscribeConversations();
        unsubscribeConversations = null;
      }

      currentConversationId = null;
      currentOtherUser = null;
    }
  }
);


/* GET USER */

async function getUserProfile(uid) {

  const profileDoc =
    await getDoc(
      doc(db, "users", uid)
    );

  if (!profileDoc.exists()) {
    return null;
  }

  return profileDoc.data();
}


/* SEARCH */

searchBtn.addEventListener(
  "click",
  searchUsers
);

searchInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      searchUsers();
    }
  }
);


async function searchUsers() {

  const text =
    searchInput.value.trim().toLowerCase();

  searchResults.innerHTML = "";

  if (!text) {
    return;
  }

  try {

    const snapshot =
      await getDocs(
        collection(db, "users")
      );

    let found = false;

    snapshot.forEach(
      userDoc => {

        if (
          auth.currentUser &&
          userDoc.id === auth.currentUser.uid
        ) {
          return;
        }

        const user =
          userDoc.data();

        const email =
          (user.email || "").toLowerCase();

        const name =
          (user.displayName || "").toLowerCase();

        if (
          email.includes(text) ||
          name.includes(text)
        ) {

          found = true;

          const button =
            document.createElement("button");

          button.className =
            "user-result";

          const avatar =
            document.createElement("div");

          avatar.className =
            "avatar";

          setAvatar(
            avatar,
            user
          );

          const info =
            document.createElement("div");

          info.className =
            "user-result-info";

          const nameElement =
            document.createElement("div");

          nameElement.className =
            "user-result-name";

          nameElement.textContent =
            user.displayName || "User";

          const emailElement =
            document.createElement("div");

          emailElement.className =
            "user-result-email";

          emailElement.textContent =
            user.email || "";

          info.appendChild(nameElement);

          info.appendChild(emailElement);

          button.appendChild(avatar);

          button.appendChild(info);

          button.addEventListener(
            "click",
            () => {

              startConversation(
                userDoc.id,
                user
              );

              searchResults.innerHTML = "";

              searchInput.value = "";
            }
          );

          searchResults.appendChild(button);
        }
      }
    );

    if (!found) {
      searchResults.textContent =
        "No users found.";
    }

  } catch (error) {

    console.error(error);

    searchResults.textContent =
      "Search failed.";
  }
}


/* START CONVERSATION */

async function startConversation(
  otherUserId,
  otherUser
) {

  const currentUser =
    auth.currentUser;

  if (!currentUser) {
    return;
  }

  const participants = [
    currentUser.uid,
    otherUserId
  ].sort();

  const conversationId =
    participants.join("_");

  const conversationRef =
    doc(
      db,
      "conversations",
      conversationId
    );

  const existing =
    await getDoc(conversationRef);

  if (!existing.exists()) {

    await setDoc(
      conversationRef,
      {
        participants,
        updatedAt: serverTimestamp(),
        lastMessage: "",
        unreadCounts: {
          [currentUser.uid]: 0,
          [otherUserId]: 0
        }
      }
    );

  } else {

    const data =
      existing.data();

    if (!data.unreadCounts) {

      await updateDoc(
        conversationRef,
        {
          unreadCounts: {
            [currentUser.uid]: 0,
            [otherUserId]: 0
          }
        }
      );
    }
  }

  currentConversationId =
    conversationId;

  currentOtherUser =
    otherUser;

  emptyChat.classList.add("hidden");

  chatArea.classList.remove("hidden");

  chatTitle.textContent =
    otherUser.displayName || "User";

  chatEmail.textContent =
    otherUser.email || "";

  setAvatar(
    chatAvatar,
    otherUser
  );

  await markConversationRead(
    conversationId
  );

  listenForMessages();

  loadConversations();
}


/* MARK READ */

async function markConversationRead(
  conversationId
) {

  const user =
    auth.currentUser;

  if (!user || !conversationId) {
    return;
  }

  try {

    await updateDoc(
      doc(
        db,
        "conversations",
        conversationId
      ),
      {
        [`unreadCounts.${user.uid}`]: 0
      }
    );

  } catch (error) {

    console.error(
      "Could not mark as read:",
      error
    );
  }
}


/* LOAD CONVERSATIONS */

function loadConversations() {

  const user =
    auth.currentUser;

  if (!user) {
    return;
  }

  if (unsubscribeConversations) {
    unsubscribeConversations();
  }

  const conversationsQuery =
    query(
      collection(db, "conversations"),
      where(
        "participants",
        "array-contains",
        user.uid
      ),
      orderBy(
        "updatedAt",
        "desc"
      )
    );

  unsubscribeConversations =
    onSnapshot(
      conversationsQuery,
      async snapshot => {

        conversationList.innerHTML = "";

        for (
          const conversationDoc
          of snapshot.docs
        ) {

          const conversation =
            conversationDoc.data();

          const otherId =
            conversation.participants.find(
              id => id !== user.uid
            );

          if (!otherId) {
            continue;
          }

          const otherUser =
            await getUserProfile(otherId);

          if (!otherUser) {
            continue;
          }

          const button =
            document.createElement("button");

          button.className =
            "conversation";

          if (
            conversationDoc.id ===
            currentConversationId
          ) {
            button.classList.add("active");
          }

          const avatar =
            document.createElement("div");

          avatar.className =
            "avatar";

          setAvatar(
            avatar,
            otherUser
          );

          const info =
            document.createElement("div");

          info.className =
            "conversation-info";

          const row =
            document.createElement("div");

          row.className =
            "conversation-row";

          const name =
            document.createElement("div");

          name.className =
            "conversation-name";

          name.textContent =
            otherUser.displayName ||
            otherUser.email;

          const time =
            document.createElement("div");

          time.className =
            "conversation-time";

          time.textContent =
            formatTimestamp(
              conversation.updatedAt
            );

          row.appendChild(name);

          row.appendChild(time);

          const bottom =
            document.createElement("div");

          bottom.className =
            "conversation-bottom";

          const preview =
            document.createElement("div");

          preview.className =
            "conversation-preview";

          preview.textContent =
            conversation.lastMessage ||
            "No messages yet";

          bottom.appendChild(preview);

          const unreadCount =
            conversation.unreadCounts?.[user.uid] || 0;

          if (unreadCount > 0) {

            const unread =
              document.createElement("div");

            unread.className =
              "unread";

            unread.textContent =
              unreadCount === 1
                ? "1 unread"
                : `${unreadCount} unread`;

            bottom.appendChild(unread);
          }

          info.appendChild(row);

          info.appendChild(bottom);

          button.appendChild(avatar);

          button.appendChild(info);

          button.addEventListener(
            "click",
            () => {

              startConversation(
                otherId,
                otherUser
              );
            }
          );

          conversationList.appendChild(button);
        }
      },
      error => {

        console.error(
          "Conversation error:",
          error
        );
      }
    );
}


/* LISTEN FOR MESSAGES */

function listenForMessages() {

  if (!currentConversationId) {
    return;
  }

  if (unsubscribeMessages) {
    unsubscribeMessages();
  }

  const messagesQuery =
    query(
      collection(
        db,
        "conversations",
        currentConversationId,
        "messages"
      ),
      orderBy(
        "createdAt",
        "asc"
      )
    );

  unsubscribeMessages =
    onSnapshot(
      messagesQuery,
      snapshot => {

        messagesDiv.innerHTML = "";

        snapshot.forEach(
          messageDoc => {

            const message =
              messageDoc.data();

            const wrap =
              document.createElement("div");

            const mine =
              message.senderId ===
              auth.currentUser.uid;

            wrap.className =
              "message-wrap " +
              (mine ? "mine" : "");

            const box =
              document.createElement("div");

            box.className =
              "message";

            box.textContent =
              message.text || "";

            if (message.createdAt) {

              const time =
                document.createElement("div");

              time.className =
                "message-time";

              time.textContent =
                formatTimestamp(
                  message.createdAt
                );

              box.appendChild(time);
            }

            wrap.appendChild(box);

            messagesDiv.appendChild(wrap);
          }
        );

        messagesDiv.scrollTop =
          messagesDiv.scrollHeight;
      },
      error => {

        console.error(
          "Message error:",
          error
        );
      }
    );
}


/* SEND MESSAGE */

sendBtn.addEventListener(
  "click",
  sendMessage
);

messageInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      sendMessage();
    }
  }
);


async function sendMessage() {

  const text =
    messageInput.value.trim();

  const user =
    auth.currentUser;

  if (
    !text ||
    !user ||
    !currentConversationId
  ) {
    return;
  }

  try {

    const conversationRef =
      doc(
        db,
        "conversations",
        currentConversationId
      );

    const conversationSnapshot =
      await getDoc(conversationRef);

    if (!conversationSnapshot.exists()) {
      return;
    }

    const conversation =
      conversationSnapshot.data();

    const recipientId =
      conversation.participants.find(
        id => id !== user.uid
      );

    await addDoc(
      collection(
        db,
        "conversations",
        currentConversationId,
        "messages"
      ),
      {
        text: text,
        senderId: user.uid,
        createdAt: serverTimestamp()
      }
    );

    await runTransaction(
      db,
      async transaction => {

        const latest =
          await transaction.get(
            conversationRef
          );

        const data =
          latest.data() || {};

        const unreadCounts =
          data.unreadCounts || {};

        const currentUnread =
          unreadCounts[recipientId] || 0;

        unreadCounts[recipientId] =
          currentUnread + 1;

        unreadCounts[user.uid] = 0;

        transaction.update(
          conversationRef,
          {
            updatedAt:
              serverTimestamp(),

            lastMessage:
              text,

            unreadCounts:
              unreadCounts
          }
        );
      }
    );

    messageInput.value = "";

    messageInput.focus();

  } catch (error) {

    console.error(error);

    alert(
      "Message could not be sent."
    );
  }
}


/* TIME */

function formatTimestamp(timestamp) {

  if (
    !timestamp ||
    !timestamp.toDate
  ) {
    return "";
  }

  const date =
    timestamp.toDate();

  const now =
    new Date();

  if (
    date.toDateString() ===
    now.toDateString()
  ) {

    return date.toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );
  }

  return date.toLocaleDateString(
    [],
    {
      month: "short",
      day: "numeric"
    }
  );
}


/* ERRORS */

function friendlyError(error) {

  switch (error.code) {

    case "auth/email-already-in-use":
      return "That email already has an account.";

    case "auth/invalid-email":
      return "Please enter a valid email.";

    case "auth/invalid-credential":
      return "Incorrect email or password.";

    case "auth/weak-password":
      return "Password must be at least 6 characters.";

    case "auth/too-many-requests":
      return "Too many attempts. Try again later.";

    default:
      return error.message ||
        "Something went wrong.";
  }
}
